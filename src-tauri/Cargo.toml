[package]
name = "coursera-dl-gui"
version = "1.0.0"
description = "High-performance native Coursera course downloader & manager"
authors = ["Coursera DL"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coursera_dl_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = "0.4"
dirs = "5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "sync", "time"] }
futures-util = "0.3"
urlencoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "cookies"] }
bytes = "1"
rand = "0.8"
