name: Feature request
description: Suggest an improvement to Coursera DL
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Features must support personal, authorized archival use and must not bypass access controls or facilitate redistribution.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: This request is consistent with personal, authorized use of Coursera DL.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like the feature to work.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Authentication
        - Course discovery or enrollment
        - Downloads
        - File organization
        - Settings
        - User interface
        - Installation or updates
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or related links. Do not include credentials, personal data, or copyrighted course content.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this feature.
